server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /order-invite-app {
    # Preserve the interactive Flutter page for browsers while serving crawler-readable
    # metadata for social preview clients that cannot execute Flutter Web.
    error_page 418 = @order-invite-crawler;
    if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|Discordbot|TelegramBot|Googlebot)") {
      return 418;
    }
    try_files $uri /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location @order-invite-crawler {
    rewrite ^/order-invite-app$ /order-invite break;
    proxy_pass ${API_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /order-invite {
    proxy_pass ${API_ORIGIN}/order-invite;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /order-invite/share-image {
    proxy_pass ${API_ORIGIN}/order-invite/share-image;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /order-invite-preview {
    try_files $uri /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location /api/ {
    proxy_pass ${API_ORIGIN}/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /favicon.svg {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /favicon.ico {
    return 302 /favicon.svg;
  }

  location = /flutter_bootstrap.js {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /flutter_service_worker.js {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /manifest.json {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.(?:css|js|mjs|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|wasm)$ {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
}
