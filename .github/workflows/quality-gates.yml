name: Pull Request Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check changed-file scope
        if: github.event_name != 'workflow_call'
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          npm run check:scope -- --scope cross-cutting --base "$base"
      - name: Check repository boundaries
        if: github.event_name == 'workflow_call'
        run: npm run check:dependencies

  verify:
    needs: scope
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/master_travel_project?schema=public
    strategy:
      fail-fast: false
      matrix:
        area: [passenger, api, admin, driver, brand]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:dependencies
      - if: matrix.area == 'api'
        run: npm --prefix backend ci
      - if: matrix.area == 'admin'
        run: npm --prefix admin ci
      - if: matrix.area == 'brand'
        run: npm --prefix brand ci
      - if: matrix.area == 'driver'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - if: matrix.area == 'driver'
        run: flutter pub get
        working-directory: driver
      - name: Verify affected area
        if: github.event_name != 'workflow_call'
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          npm run verify:affected -- --area "${{ matrix.area }}" --base "$base"
      - name: Verify production area
        if: github.event_name == 'workflow_call'
        run: npm run "verify:${{ matrix.area }}"
