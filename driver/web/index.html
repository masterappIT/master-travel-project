<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Master App Driver">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Master App Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Master App Driver</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f5f7fb;
      overscroll-behavior-y: auto;
      overflow: hidden;
    }

    #safari-scroll-bridge {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 100dvh;
      overflow-y: scroll;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    #safari-scroll-bridge > div {
      height: 200vh;
    }

    body {
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      box-sizing: border-box;
    }
  </style>
  <script>
    (() => {
      const isSafari = /Safari/.test(navigator.userAgent) &&
        !/Chrome|CriOS|Android/.test(navigator.userAgent);
      if (!isSafari) return;

      document.documentElement.classList.add('safari-scroll');

      window.updateSafariScrollBridge = (offset) => {
        const bridge = document.getElementById('safari-scroll-bridge');
        if (bridge) bridge.scrollTop = Number(offset) || 0;
      };
    })();
  </script>
</head>
<body>
  <div id="safari-scroll-bridge" aria-hidden="true"><div></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
