<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Master App Driver">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MasterApp｜司機端">
  <link rel="apple-touch-icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <title>MasterApp｜司機端</title>
  <script>
    if (window.location.pathname.replace(/\/+$/, '') === '/order-invite') {
      document.title = 'MasterApp｜司機端 ｜邀請接單';
    }
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f4f7fb;
      overscroll-behavior-y: auto;
    }

    body {
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: 0;
      padding-left: env(safe-area-inset-left);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove service workers/caches left by older Flutter Web releases before boot.
    window.__driverCacheMigration = (async () => {
      const migrationKey = 'driver-flutter-cache-migration-v1';
      if (localStorage.getItem(migrationKey) === 'done') return false;

      const registrations = await navigator.serviceWorker?.getRegistrations?.() ?? [];
      await Promise.all(registrations.map((registration) => registration.unregister()));

      if (window.caches) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
      }

      localStorage.setItem(migrationKey, 'done');
      return registrations.length > 0;
    })().catch(() => {
      localStorage.setItem('driver-flutter-cache-migration-v1', 'done');
      return false;
    });
  </script>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
