<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Master App Driver">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Master App Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Master App Driver</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f5f7fb;
      overscroll-behavior-y: auto;
    }

    body {
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      box-sizing: border-box;
    }

    html.safari-scroll {
      height: auto !important;
      min-height: 100%;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    html.safari-scroll body {
      position: static !important;
      height: auto !important;
      min-height: calc(100dvh + var(--safari-scroll-extent, 160px));
      padding: 0 !important;
      overflow: visible !important;
      touch-action: pan-y !important;
    }

    html.safari-scroll flutter-view {
      position: fixed !important;
      inset: 0 !important;
      width: auto !important;
      height: auto !important;
    }

    #safari-toolbar-runway {
      display: none;
    }

    html.safari-scroll #safari-toolbar-runway {
      display: block;
      width: 1px;
      height: calc(100dvh + var(--safari-scroll-extent, 160px));
      pointer-events: none;
    }
  </style>
  <script>
    (() => {
      const platform = navigator.platform || '';
      const userAgent = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/.test(platform) ||
        (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isSafari = isIOS && /AppleWebKit/.test(userAgent) &&
        !/CriOS|FxiOS|EdgiOS|OPiOS/.test(userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;

      if (!isSafari || isStandalone) return;

      document.documentElement.classList.add('safari-scroll');

      window.updateSafariScrollBridge = (offset, maxOffset, shouldScroll) => {
        const runway = document.getElementById('safari-toolbar-runway');
        if (runway) {
          const scrollExtent = Math.max(160, Number(maxOffset) || 0);
          runway.style.setProperty('--safari-scroll-extent', `${scrollExtent}px`);
          document.documentElement.style.setProperty(
            '--safari-scroll-extent',
            `${scrollExtent}px`,
          );
        }
        if (!shouldScroll) return;

        window.scrollTo(0, Math.max(0, Number(offset) || 0));
      };
    })();
  </script>
</head>
<body>
  <div id="safari-toolbar-runway" aria-hidden="true"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
